name: Deploy browser prototypes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "WebGLPrototype/**"
      - "WebARPrototype/**"
      - ".github/workflows/deploy-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble browser sites
        run: |
          mkdir -p _site/WebARPrototype
          cp -R WebGLPrototype/. _site/
          cp -R WebARPrototype/. _site/WebARPrototype/
      - name: Upload browser sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
